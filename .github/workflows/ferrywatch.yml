name: ferrywatch

# Bevakar fordonsplatser pa Eckerolinjen 20/9 kl 13:30, Eckero -> Grisslehamn.
#
# Varfor det ser ut sa har:
#
# GitHubs "schedule" accepterar inte tatare an var 5:e minut, och kor dessutom
# best effort - slottar hoppas over helt vid hog last. Att lita pa hur ofta
# GitHub STARTAR jobbet ger darfor oparlitlig bevakning.
#
# Losningen ar att inte lita pa startfrekvensen alls. Varje jobb pollar
# kontinuerligt i upp till 25 minuter i stallet for att gora ett par stickprov
# och do. cancel-in-progress ser till att en ny start ersatter den gamla, sa
# det finns alltid exakt en pollare vid liv. Kommer schemat igang i tid byts
# pollaren ut var 5:e minut; drojer GitHub en kvart fortsatter den som redan
# kor att kolla under tiden.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:        # gor att du kan trycka "Run workflow" manuellt

permissions:
  contents: write           # behovs for att spara state.json mellan korningar

concurrency:
  group: ferrywatch
  cancel-in-progress: true  # en ny start tar over efter den gamla

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      ROUTE: EG
      DATE: "2026-09-20"
      TIME: "13:30"
      ROUTE_LABEL: "Eckerö → Grisslehamn (GitHub)"
      WATCH_GROUP: vehicles
      ALERT_ON: "low,high"
      INTERVAL_SECONDS: "90"
      JITTER_SECONDS: "15"
      REMIND_MINUTES: "30"
      HEARTBEAT_HOURS: "6"
      STATE_FILE: state.json
      LOG_FILE: ""            # tomt = logga bara till jobbloggen
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

    steps:
      - uses: actions/checkout@v4

      - name: Kontrollera att larmkanalen ar konfigurerad
        run: |
          if [ -z "$NTFY_TOPIC" ]; then
            echo "::error::Hemligheten NTFY_TOPIC saknas. Lagg till den under"
            echo "::error::Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      # timeout ger exit 124 nar tiden ar ute, vilket ar ett normalt slut har.
      # Skriptet sparar state efter varje kontroll, sa ett avbrott mitt i
      # forlorar pa sin hojd den sista avlasningen.
      - name: Bevaka kontinuerligt
        run: timeout 1500 python3 ferrywatch.py --loop || true

      - name: Spara state
        if: always()
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name  "ferrywatch"
            git config user.email "ferrywatch@users.noreply.github.com"
            git add state.json
            git commit -m "state: $(python3 -c "import json;s=json.load(open('state.json'));print(s.get('status','?'), 'bokningsbar='+str(s.get('bookable','?')))")"
            for i in 1 2 3; do
              git pull --rebase --autostash && git push && break
              echo "Push-forsok $i misslyckades, provar igen"
              sleep 5
            done
          else
            echo "Ingen forandring i state.json"
          fi

name: ferrywatch

# Bevakar fordonsplatser pa Eckerolinjen 20/9 kl 13:30, Eckero -> Grisslehamn.
#
# ---------------------------------------------------------------------------
# Varfor schemat ser konstigt ut
# ---------------------------------------------------------------------------
#
# Observerat 2026-09-14: repot skapades 06:53, workflowen fick sitt innehall
# 07:04. Fram till 08:05 startade GitHubs schemalaggare INTE en enda korning,
# trots cron "*/5 * * * *" - alltsa tolv missade slottar i rad. Kontrollerat
# att det inte var felkonfiguration: workflowens tillstand var "active",
# repot publikt och oarkiverat, filen lag pa standardgrenen main, cron-
# uttrycket giltigt, Actions tillatet, manuella korningar gick igenom, och
# githubstatus.com rapporterade Actions som operational utan incidenter.
#
# Slutsats: GitHubs "schedule" ar best effort och gar inte att lita pa som
# taktgivare. Konstruktionen bygger darfor inte pa hur ofta GitHub STARTAR
# jobbet, utan pa hur lange varje jobb LEVER.
#
#   - Varje korning pollar kontinuerligt i upp till en timme.
#   - Schemat forsoker tre ganger i timmen, pa udda minuter. Jamna
#     femminutersslag ar de mest overbelastade hos GitHub.
#   - cancel-in-progress gor att en ny start ersatter den gamla, sa det
#     finns alltid hogst en pollare - och minst en sa lange nagon trigger
#     nar fram nagon gang per timme.
#
# Foljden: tidigare kravdes en trafff var 5:e minut for obruten bevakning.
# Nu racker en traff i timmen. Missar schemat tva av tre forsok spelar det
# ingen roll.
#
# Den lokala bevakaren (ferrywatch-lokal.py) ar oberoende av allt det har
# och ar det som faktiskt garanterar takten.
# ---------------------------------------------------------------------------

on:
  schedule:
    - cron: "7,27,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ferrywatch
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 70

    env:
      ROUTE: EG
      DATE: "2026-09-20"
      TIME: "13:30"
      ROUTE_LABEL: "Eckerö → Grisslehamn (GitHub)"
      WATCH_GROUP: vehicles
      ALERT_ON: "low,high"
      INTERVAL_SECONDS: "90"
      JITTER_SECONDS: "15"
      REMIND_MINUTES: "30"
      HEARTBEAT_HOURS: "6"
      STATE_FILE: state.json
      LOG_FILE: ""
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

    steps:
      - uses: actions/checkout@v4

      - name: Kontrollera att larmkanalen ar konfigurerad
        run: |
          if [ -z "$NTFY_TOPIC" ]; then
            echo "::error::Hemligheten NTFY_TOPIC saknas. Lagg till den under"
            echo "::error::Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      # timeout ger exit 124 nar timmen ar ute, vilket ar ett normalt slut har.
      # Skriptet sparar state efter varje kontroll, sa ett avbrott mitt i
      # forlorar pa sin hojd den sista avlasningen.
      - name: Bevaka kontinuerligt i upp till en timme
        run: timeout 3600 python3 ferrywatch.py --loop || true

      # always() kor aven nar jobbet avbryts av en ny start, sa state hinner
      # sparas innan den gamla pollaren ersatts.
      - name: Spara state
        if: always()
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name  "ferrywatch"
            git config user.email "ferrywatch@users.noreply.github.com"
            git add state.json
            git commit -m "state: $(python3 -c "import json;s=json.load(open('state.json'));print(s.get('status','?'), 'bokningsbar='+str(s.get('bookable','?')))")"
            for i in 1 2 3; do
              git pull --rebase --autostash && git push && break
              echo "Push-forsok $i misslyckades, provar igen"
              sleep 5
            done
          else
            echo "Ingen forandring i state.json"
          fi
